[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "beliefaudit"
version = "0.1.3"
description = "Pre-selection open-weight model belief distillation, 4D bias matrix, and downstream coding leakage auditor with KnowledgeReduce-compatible shards."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
  { name = "Nels Lindahl", email = "nelsl@nelslindahl.com" },
]
keywords = [
  "llm-evaluation",
  "bias-audit",
  "open-weight-models",
  "knowledge-graph",
  "knowledgereduce",
  "model-selection",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]

dependencies = [
  "pydantic>=2.7,<3",
  "httpx>=0.27,<1",
  "typer>=0.12,<1",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "pip-audit>=2.7",
]

[project.scripts]
beliefaudit = "beliefaudit.cli:app"

[project.urls]
Homepage = "https://github.com/nelslindahlx/BeliefAudit"
Repository = "https://github.com/nelslindahlx/BeliefAudit"
Issues = "https://github.com/nelslindahlx/BeliefAudit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/beliefaudit"]

[tool.hatch.build.targets.sdist]
exclude = [
  ".venv/**",
  ".git/**",
  "runs/**",
  "shards/**",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "B",
  "UP",
  "S",
  "SIM",
  "RUF",
]
ignore = [
  "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
"examples/**/*.py" = ["S101"]
"scripts/**/*.py" = ["S603", "S607"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["src/beliefaudit"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
