name: Manual CI

on:
  workflow_dispatch:

jobs:
  local-ci-mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run full CI gate
        run: make local-ci
